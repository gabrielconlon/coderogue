id: ch2-04
title: Light the Causeway
chapter: 2
order: 4
optional: false
concepts: [for, range, accumulator, input]
vim_skill: "dd (delete a whole line)"
lore: |
  The causeway lanterns are numbered 1 to n, and lantern k burns k measures
  of oil. The lamplighter wants to know how many measures the whole row will
  swallow before she lights a single wick. "I could add them by hand,"
  she says. "I could also be a mathematician. Let a loop do it."
limits: {timeout_s: 2, max_stdout_kb: 16}
languages:
  python:
    starter: |
      # n, the number of lanterns, arrives through input().
      n = int(input())
      total = 0
      for i in range(1, ___ + 1):
          total = total + ___
      print(total)
    hints:
      - &lanterns_h1 "A for loop visits each lantern from 1 up to n in turn. Keep a running total that starts at 0 and grows by the current lantern's number each lap."
      - "range(1, n + 1) gives 1 up to and including n, because the end of a range is left out. Inside the loop, add the loop variable to total."
      - "First blank: n   Second blank: i"
    solution: |
      n = int(input())
      total = 0
      for i in range(1, n + 1):
          total = total + i
      print(total)
    source_checks:
      - pattern: '\b(for|while)\b'
        message: "The lamplighter wants a loop here, not a formula. Use for (or while) to add the lanterns one at a time."
  bash:
    starter: |
      # n, the number of lanterns, arrives on stdin.
      read -r n
      total=0
      for ((i=1; i<=___; i++)); do
        total=$((total + ___))
      done
      echo "$total"
    hints:
      - *lanterns_h1
      - "for ((i=1; i<=n; i++)) walks i from 1 up to and including n. Inside $(( )), variables need no dollar sign, so total + i adds the current lantern."
      - "First blank: n   Second blank: i"
    solution: |
      read -r n
      total=0
      for ((i=1; i<=n; i++)); do
        total=$((total + i))
      done
      echo "$total"
    source_checks:
      - pattern: '\b(for|while)\b'
        message: "The lamplighter wants a loop here, not a formula. Use for (or while) to add the lanterns one at a time."
  powershell:
    starter: |
      # n, the number of lanterns, arrives on stdin.
      $n = [int][Console]::In.ReadLine()
      $total = 0
      for ($i = 1; $i -le ___; $i++) {
          $total = $total + ___
      }
      Write-Output $total
    hints:
      - *lanterns_h1
      - "for ($i = 1; $i -le $n; $i++) walks $i from 1 up to and including $n. Inside the braces, add $i to $total."
      - "First blank: $n   Second blank: $i"
    solution: |
      $n = [int][Console]::In.ReadLine()
      $total = 0
      for ($i = 1; $i -le $n; $i++) {
          $total = $total + $i
      }
      Write-Output $total
    source_checks:
      - pattern: '(?i)\b(for|foreach|while)\b'
        message: "The lamplighter wants a loop here, not a formula. Use for (or while) to add the lanterns one at a time."
tests:
  - name: "Four lanterns"
    stdin: "4\n"
    expect: {stdout: "10\n", exit_code: 0}
  - name: "A single lantern"
    stdin: "1\n"
    expect: {stdout: "1\n"}
  - name: "No lanterns"
    stdin: "0\n"
    expect: {stdout: "0\n"}
  - name: "A long causeway"
    stdin: "100\n"
    expect: {stdout: "5050\n"}
reward:
  xp: 60
  items: [oil_flask]
  unlocks: []
  world_effect: "The causeway lanterns blaze one after another, and the path ahead glows like a runway."
