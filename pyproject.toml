[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "coderogue"
version = "0.0.1"
description = "A top-down action roguelike that teaches programming with VIM keys, Python, bash, and PowerShell."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pygame-ce~=2.5.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
build = ["pyinstaller>=6.16"]

[project.scripts]
coderogue = "coderogue.app:main"

[tool.setuptools.packages.find]
include = ["coderogue*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
